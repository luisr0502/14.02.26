<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz San Valentín 💛</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: linear-gradient(135deg, #ffd6e8, #fff3b0);
}

/* PANTALLA 404 */
#errorScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
}

#errorScreen input {
    padding: 10px;
    margin-top: 10px;
    border-radius: 20px;
    border: none;
    text-align: center;
}

#errorScreen button {
    margin-top: 10px;
    padding: 8px 15px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
}

/* CONTENIDO PRINCIPAL */
.main {
    display: none;
    width: 100%;
    height: 100vh;
    position: relative;
}

/* CUADRO CENTRAL MEDIANO */
.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 350px;          /* tamaño mediano */
    padding: 20px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
    z-index: 5;
}

h1 {
    color: #ff6b9d;
    font-size: 22px;
    margin-bottom: 15px;
}

/* VIDEO MÁS PEQUEÑO */
video {
    width: 250px;
    border-radius: 15px;
}

/* FRASES */
#mensaje {
    margin-top: 15px;
    font-weight: bold;
    min-height: 50px;
    font-size: 14px;
}

/* FOTOS LATERALES */
.foto {
    position: absolute;
    width: 140px;
    height: 180px;
    object-fit: cover;
    border-radius: 15px;
    opacity: 0;
    animation: flotar 5s ease forwards;
    pointer-events: auto;
}

@keyframes flotar {
    0% { opacity: 0; transform: translateY(0px); }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-150px); }
}

/* EMOJIS */
.emoji {
    position: absolute;
    font-size: 20px;
    animation: emojiFloat 1s ease-out forwards;
    pointer-events: none;
}

@keyframes emojiFloat {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-40px); }
}

</style>
</head>

<body>

<!-- 404 -->
<div id="errorScreen">
    <h1>404 - Página No Encontrada</h1>
    <p>Introduce la contraseña 💛</p>
    <input type="password" id="password">
    <button onclick="checkPassword()">Entrar</button>
</div>

<!-- CONTENIDO -->
<div class="main" id="mainContent">

    <div class="container">
        <h1>Feliz San Valentín 💛</h1>

        <video autoplay loop muted playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>

        <p id="mensaje"></p>
    </div>

</div>

<audio id="musica" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

/* CONTRASEÑA */
function checkPassword(){
    const pass = document.getElementById("password").value;
    if(pass === "221124"){
        document.getElementById("errorScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        document.getElementById("musica").play();
        mostrarFrase();
    } else {
        alert("Contraseña incorrecta 💔");
    }
}

/* FRASES */
const frases = Array.from({length:100}, (_,i)=> 
`Razón ${i+1} por la que me haces feliz 💛`
);

function mostrarFrase(){
    const random = Math.floor(Math.random()*frases.length);
    document.getElementById("mensaje").innerText = frases[random];
    setTimeout(mostrarFrase, 4000);
}

/* FOTOS 1.jpeg, 2.jpeg, etc */
const imagenes = [
"1.jpeg","2.jpeg","3.jpeg","4.jpeg",
"5.jpeg","6.jpeg","7.jpeg","8.jpeg"
];

let fotosActivas = [];

function crearFoto(){
    if(fotosActivas.length >= 5) return;

    let imgSrc;
    do {
        imgSrc = imagenes[Math.floor(Math.random()*imagenes.length)];
    } while(fotosActivas.includes(imgSrc));

    fotosActivas.push(imgSrc);

    const img = document.createElement("img");
    img.src = imgSrc;
    img.classList.add("foto");

    const ladoIzq = Math.random() < 0.5;

    if(ladoIzq){
        img.style.left = (Math.random()*25) + "vw";
    } else {
        img.style.right = (Math.random()*25) + "vw";
    }

    img.style.top = (Math.random()*60 + 25) + "vh";

    document.body.appendChild(img);

    /* EMOJIS */
    img.addEventListener("mousemove", function(e){
        const emojis = ["💛","😍","🥰","💖","✨"];
        const emoji = document.createElement("div");
        emoji.classList.add("emoji");
        emoji.innerText = emojis[Math.floor(Math.random()*emojis.length)];
        emoji.style.left = e.pageX + "px";
        emoji.style.top = e.pageY + "px";
        document.body.appendChild(emoji);
        setTimeout(()=>emoji.remove(),1000);
    });

    setTimeout(()=>{
        img.remove();
        fotosActivas = fotosActivas.filter(f=>f!==imgSrc);
    },5000);
}

setInterval(crearFoto, 1200);

</script>

</body>
</html>
