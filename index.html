/* =========================
   FRASES
========================= */

const frases = [
  "Eres mi lugar seguro incluso en los días difíciles 💛",
  "Tu risa arregla cualquier momento gris ✨",
  "Contigo aprendí que el amor es hogar 🏡",

  document.getElementById("mensaje").innerText = frases[random];
  setTimeout(mostrarFrase, 5000);

/* =========================
   DIARIO (AHORA CON FIREBASE)
========================= */

window.abrirDiario = function(){
  document.getElementById("diarioModal").style.display="flex";
}

window.cerrarDiario = function(){
  document.getElementById("diarioModal").style.display="none";
}

window.guardarNota = async function(){

  const texto = document.getElementById("textoNota").value;
  if(!texto) return;

  await addDoc(collection(db, "notas"), {
    texto: texto,
    fecha: new Date()
  });

  document.getElementById("textoNota").value="";
  mostrarNotas();
}

window.verNotas = function(){
  abrirDiario();
  mostrarNotas();
}

window.mostrarNotas = async function(){

  const lista = document.getElementById("listaNotas");
  lista.innerHTML="";

  const querySnapshot = await getDocs(collection(db, "notas"));

  let notas = [];

  querySnapshot.forEach((doc)=>{
    notas.push(doc.data());
  });

  notas.reverse().forEach(nota=>{
    const div=document.createElement("div");
    div.classList.add("nota");

    const fecha = new Date(nota.fecha.seconds * 1000);

    div.innerHTML = `
      <strong>${fecha.toLocaleString()}</strong><br>
      ${nota.texto}
    `;

    lista.appendChild(div);
  });
}

/* =========================
   FOTOS
========================= */

const imagenes = ["1.jpeg","2.jpeg","3.jpeg","4.jpeg","5.jpeg","6.jpeg"];
let fotosActivas = [];

function crearFoto(){
  if(fotosActivas.length >= 4) return;

  let imgSrc;
  do {
    imgSrc = imagenes[Math.floor(Math.random()*imagenes.length)];
  } while(fotosActivas.includes(imgSrc));

  fotosActivas.push(imgSrc);

  const img = document.createElement("img");
  img.src = imgSrc;
  img.classList.add("foto");

  if(Math.random() < 0.5){
    img.style.left = (Math.random()*20) + "vw";
  } else {
    img.style.right = (Math.random()*20) + "vw";
  }

  img.style.top = (Math.random()*50 + 10) + "vh";

  document.body.appendChild(img);
  img.addEventListener("mousemove", crearEmoji);

  setTimeout(()=>{
    img.remove();
    fotosActivas = fotosActivas.filter(f=>f!==imgSrc);
  },9000);
}

setInterval(crearFoto, 2500);

/* =========================
   EMOJIS (REDUCIDOS)
========================= */

let ultimoEmoji = 0;

function crearEmoji(e){
  const ahora = Date.now();
  if(ahora - ultimoEmoji < 120) return; // limita cantidad
  ultimoEmoji = ahora;

  const emojis = ["💛","💭","✨"];
  const emoji = document.createElement("div");
  emoji.classList.add("emoji");
  emoji.innerText = emojis[Math.floor(Math.random()*emojis.length)];

  emoji.style.left = e.pageX + "px";
  emoji.style.top = e.pageY + "px";

  document.body.appendChild(emoji);

  setTimeout(()=>emoji.remove(),1000);
}

document.querySelectorAll("button").forEach(btn=>{
  btn.addEventListener("mousemove", crearEmoji);
});
