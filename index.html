<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz San Valentín 💛</title>

<link rel="icon" type="image/png" href="corazon.png">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    background: linear-gradient(135deg, #ffd6e8, #fff3b0);
}

/* 404 */
#errorScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
}

/* MAIN */
.main {
    display: none;
    width: 100%;
    height: 100vh;
    position: relative;
}

/* CUADRO CENTRAL */
.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 360px;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
    z-index: 5;
}

h1 {
    font-family: 'Great Vibes', cursive;
    color: #ff4f87;
    font-size: 36px;
}

video {
    width: 240px;
    border-radius: 15px;
}

#mensaje {
    margin-top: 15px;
    min-height: 70px;
    font-size: 14px;
}

/* BOTONES */
button {
    margin-top: 8px;
    padding: 6px 12px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    background: #ff6b9d;
    color: white;
}

/* DIARIO MODAL */
#diarioModal {
    display: none;
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    z-index: 20;
}

#diarioContent {
    background: white;
    width: 400px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
    border-radius: 15px;
}

textarea {
    width: 100%;
    height: 80px;
    border-radius: 10px;
    padding: 8px;
}

.nota {
    background: #fff8dc;
    padding: 10px;
    border-radius: 10px;
    margin-top: 10px;
    font-size: 13px;
}

/* FOTOS */
.foto {
    position: absolute;
    width: 150px;
    height: 200px;
    object-fit: cover;
    border-radius: 15px;
    opacity: 0;
    animation: flotar 9s ease forwards;
}

@keyframes flotar {
    0% { opacity: 0; transform: translateY(0px); }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-80px); }
}

/* EMOJIS */
.emoji {
    position: absolute;
    font-size: 20px;
    animation: emojiFloat 1s ease-out forwards;
    pointer-events: none;
}

@keyframes emojiFloat {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-40px); }
}

</style>
</head>

<body>

<div id="errorScreen">
    <h1 style="font-family:Poppins;">404 - Página No Encontrada</h1>
    <p>Introduce la contraseña 💛</p>
    <input type="password" id="password">
    <button onclick="checkPassword()">Entrar</button>
</div>

<div class="main" id="mainContent">
    <div class="container">
        <h1>Feliz San Valentín 💛</h1>

        <video autoplay loop muted playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>

        <p id="mensaje"></p>

        <button onclick="abrirDiario()">Escribir pensamiento 📝</button>
        <button onclick="verNotas()">Ver notas 📒</button>
    </div>
</div>

<!-- DIARIO -->
<div id="diarioModal">
    <div id="diarioContent">
        <h3>Nuestro Diario 💛</h3>
        <textarea id="textoNota" placeholder="Escribe lo que sientes..."></textarea>
        <button onclick="guardarNota()">Guardar</button>
        <div id="listaNotas"></div>
        <button onclick="cerrarDiario()">Cerrar</button>
    </div>
</div>

<audio id="musica" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

/* CONTRASEÑA */
function checkPassword(){
    if(document.getElementById("password").value === "221124"){
        document.getElementById("errorScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        document.getElementById("musica").play();
        mostrarFrase();
    }
}

/* FRASES */
const frases = [
"Eres mi lugar seguro incluso en los días difíciles 💛",
"Tu risa arregla cualquier momento gris ✨",
"Contigo aprendí que el amor es hogar 🏡",
"Tu mirada calma mi mundo 🌎",
"Me haces feliz de formas que no imaginaba 🥰",
"Tu abrazo es mi sitio favorito 🤗",
"Tu sonrisa ilumina todo ☀️",
"Eres mi mejor decisión 💖",
"Tu cariño me da fuerza 💪",
"Y te elegiría siempre 💫"
];

function mostrarFrase(){
    const random = Math.floor(Math.random()*frases.length);
    document.getElementById("mensaje").innerText = frases[random];
    setTimeout(mostrarFrase, 5000);
}

/* FOTOS AJUSTADAS */
const imagenes = ["1.jpeg","2.jpeg","3.jpeg","4.jpeg","5.jpeg","6.jpeg"];
let fotosActivas = [];

function crearFoto(){
    if(fotosActivas.length >= 4) return;

    let imgSrc;
    do {
        imgSrc = imagenes[Math.floor(Math.random()*imagenes.length)];
    } while(fotosActivas.includes(imgSrc));

    fotosActivas.push(imgSrc);

    const img = document.createElement("img");
    img.src = imgSrc;
    img.classList.add("foto");

    const ladoIzq = Math.random() < 0.5;

    if(ladoIzq){
        img.style.left = (Math.random()*20) + "vw";
    } else {
        img.style.right = (Math.random()*20) + "vw";
    }

    /* evitar que salgan cortadas abajo */
    img.style.top = (Math.random()*50 + 10) + "vh";

    document.body.appendChild(img);

    img.addEventListener("mousemove", function(e){
        const emoji = document.createElement("div");
        emoji.classList.add("emoji");
        emoji.innerText = "💛";
        emoji.style.left = e.pageX + "px";
        emoji.style.top = e.pageY + "px";
        document.body.appendChild(emoji);
        setTimeout(()=>emoji.remove(),1000);
    });

    setTimeout(()=>{
        img.remove();
        fotosActivas = fotosActivas.filter(f=>f!==imgSrc);
    },9000);
}

setInterval(crearFoto, 2500);

/* DIARIO */
function abrirDiario(){
    document.getElementById("diarioModal").style.display="flex";
}

function cerrarDiario(){
    document.getElementById("diarioModal").style.display="none";
}

function guardarNota(){
    const texto = document.getElementById("textoNota").value;
    if(!texto) return;

    const fecha = new Date().toLocaleString();
    const notas = JSON.parse(localStorage.getItem("notas")) || [];
    notas.push({texto, fecha});
    localStorage.setItem("notas", JSON.stringify(notas));
    document.getElementById("textoNota").value="";
    mostrarNotas();
}

function verNotas(){
    abrirDiario();
    mostrarNotas();
}

function mostrarNotas(){
    const lista = document.getElementById("listaNotas");
    lista.innerHTML="";
    const notas = JSON.parse(localStorage.getItem("notas")) || [];

    notas.reverse().forEach(nota=>{
        const div=document.createElement("div");
        div.classList.add("nota");
        div.innerHTML=`<strong>${nota.fecha}</strong><br>${nota.texto}`;
        lista.appendChild(div);
    });
}

</script>

</body>
</html>
