<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Valentín 💛</title>

<style>
body { font-family: Arial; text-align:center; background:#ffe6f0; }
button { padding:10px; margin:10px; border:none; border-radius:10px; background:#ff6699; color:white; cursor:pointer; }
#modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; }
#contenido { background:white; padding:20px; border-radius:10px; width:300px; max-height:80vh; overflow:auto; }
.nota { background:#fff; margin-top:10px; padding:10px; border-radius:10px; }
textarea { width:100%; height:80px; }
</style>
</head>
<body>

<h1>Feliz San Valentín 💛</h1>

<button id="escribirBtn">Escribir pensamiento</button>
<button id="verBtn">Ver notas</button>

<div id="modal">
  <div id="contenido">
    <textarea id="texto"></textarea><br>
    <button id="guardarBtn">Guardar</button>
    <div id="notas"></div>
    <button id="cerrarBtn">Cerrar</button>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA4pvaw4bZ42SEgoW3g9G2FPsHgIwu3JjQ",
  authDomain: "project-2754532206254803154.firebaseapp.com",
  projectId: "project-2754532206254803154",
  storageBucket: "project-2754532206254803154.firebasestorage.app",
  messagingSenderId: "380050788977",
  appId: "1:380050788977:web:c097824d473311576b41d0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const modal = document.getElementById("modal");
const escribirBtn = document.getElementById("escribirBtn");
const verBtn = document.getElementById("verBtn");
const guardarBtn = document.getElementById("guardarBtn");
const cerrarBtn = document.getElementById("cerrarBtn");
const texto = document.getElementById("texto");
const notasDiv = document.getElementById("notas");

escribirBtn.addEventListener("click", () => {
    modal.style.display = "flex";
    notasDiv.innerHTML = "";
});

verBtn.addEventListener("click", async () => {
    modal.style.display = "flex";
    notasDiv.innerHTML = "";

    const snapshot = await getDocs(collection(db, "notas"));
    snapshot.forEach(doc => {
        const data = doc.data();
        notasDiv.innerHTML += `
            <div class="nota">
                <p>${data.texto}</p>
            </div>
        `;
    });
});

guardarBtn.addEventListener("click", async () => {
    if(texto.value.trim() === "") return;

    await addDoc(collection(db, "notas"), {
        texto: texto.value,
        fecha: new Date()
    });

    texto.value = "";
    alert("Guardado 💛");
});

cerrarBtn.addEventListener("click", () => {
    modal.style.display = "none";
});

</script>

</body>
</html>
