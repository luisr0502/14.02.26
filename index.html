
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Feliz San Valentín 💖</title>

<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/833/833472.png">

<style>
body{
    font-family: 'Segoe UI', sans-serif;
    background: #ffe6f0;
    text-align:center;
    margin:0;
    padding:20px;
}

h1{
    font-size:40px;
    color:#ff3366;
}

button{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:10px;
    background:#ff6699;
    color:white;
    cursor:pointer;
}

textarea{
    width:80%;
    height:100px;
    margin-top:15px;
    border-radius:10px;
    padding:10px;
}

.note{
    background:white;
    margin:10px auto;
    padding:10px;
    width:70%;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<h1>Feliz San Valentín ❤️</h1>

<button onclick="mostrarFormulario()">Escribir pensamiento 💭</button>
<button onclick="cargarNotas()">Ver pensamientos 📖</button>

<div id="formulario" style="display:none;">
<textarea id="texto"></textarea><br>
<button onclick="guardarNota()">Guardar 💌</button>
</div>

<div id="notas"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 TU CONFIG YA PUESTA
const firebaseConfig = {
  apiKey: "AIzaSyA4pvaw4bZ42SEgoW3g9G2FPsHgIwu3JjQ",
  authDomain: "project-2754532206254803154.firebaseapp.com",
  projectId: "project-2754532206254803154",
  storageBucket: "project-2754532206254803154.firebasestorage.app",
  messagingSenderId: "380050788977",
  appId: "1:380050788977:web:c097824d473311576b41d0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.mostrarFormulario = function(){
    document.getElementById("formulario").style.display = "block";
}

window.guardarNota = async function(){

    const texto = document.getElementById("texto").value;

    if(texto.trim() === "") return;

    await addDoc(collection(db, "notas"), {
        texto: texto,
        fecha: new Date()
    });

    alert("Guardado 💖");
    document.getElementById("texto").value = "";
}

window.cargarNotas = async function(){

    const querySnapshot = await getDocs(collection(db, "notas"));
    const contenedor = document.getElementById("notas");
    contenedor.innerHTML = "";

    querySnapshot.forEach((doc) => {
        const data = doc.data();
        const fecha = new Date(data.fecha.seconds * 1000);

        contenedor.innerHTML += `
            <div class="note">
                <strong>${fecha.toLocaleString()}</strong>
                <p>${data.texto}</p>
            </div>
        `;
    });
}

</script>

</body>
</html>
