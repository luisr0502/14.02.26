<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz San Valentín 💛</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: linear-gradient(135deg, #ffd6e8, #fff3b0);
}

/* PANTALLA 404 */
#errorScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
}

#errorScreen input {
    padding: 10px;
    margin-top: 10px;
    border-radius: 20px;
    border: none;
    text-align: center;
}

#errorScreen button {
    margin-top: 10px;
    padding: 8px 15px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
}

/* CONTENIDO PRINCIPAL */
.main {
    display: none;
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

/* CUADRO CENTRAL */
.container {
    position: relative;
    z-index: 5;
    background: white;
    width: 420px;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
}

.center-wrapper {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

h1 {
    color: #ff6b9d;
    margin-bottom: 10px;
}

/* VIDEO */
video {
    width: 100%;
    border-radius: 15px;
}

/* FRASES */
#mensaje {
    margin-top: 15px;
    font-weight: bold;
    min-height: 50px;
}

/* FOTOS LATERALES */
.foto {
    position: absolute;
    max-width: 180px;
    max-height: 220px;
    border-radius: 15px;
    object-fit: cover;
    opacity: 0;
    animation: flotar 6s ease forwards;
    pointer-events: auto;
}

@keyframes flotar {
    0% { opacity: 0; transform: translateY(0px); }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-120px); }
}

/* EMOJIS */
.emoji {
    position: absolute;
    font-size: 22px;
    animation: emojiFloat 1s ease-out forwards;
}

@keyframes emojiFloat {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-40px); }
}

</style>
</head>

<body>

<!-- PANTALLA 404 -->
<div id="errorScreen">
    <h1>404 - Página No Encontrada</h1>
    <p>Introduce la contraseña 💛</p>
    <input type="password" id="password">
    <button onclick="checkPassword()">Entrar</button>
</div>

<!-- CONTENIDO -->
<div class="main" id="mainContent">

    <div class="center-wrapper">
        <div class="container">
            <h1>Feliz San Valentín 💛</h1>

            <video autoplay loop muted playsinline>
                <source src="video.mp4" type="video/mp4">
            </video>

            <p id="mensaje"></p>
        </div>
    </div>

</div>

<audio id="musica" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

/* CONTRASEÑA */
function checkPassword(){
    const pass = document.getElementById("password").value;
    if(pass === "221124"){
        document.getElementById("errorScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        document.getElementById("musica").play();
        mostrarFrase();
    } else {
        alert("Contraseña incorrecta 💔");
    }
}

/* 100 FRASES */
const frases = Array.from({length:100}, (_,i)=> 
`Razón #${i+1} por la que te quiero 💛`
);

function mostrarFrase(){
    const random = Math.floor(Math.random()*frases.length);
    document.getElementById("mensaje").innerText = frases[random];
    setTimeout(mostrarFrase, 4000);
}

/* FOTOS RANDOM DISPERSAS */
const imagenes = [
"foto1.jpg","foto2.jpg","foto3.jpg","foto4.jpg",
"foto5.jpg","foto6.jpg","foto7.jpg"
];

let fotosActivas = [];

function crearFoto(){
    if(fotosActivas.length >= 6) return;

    let imgSrc;
    do {
        imgSrc = imagenes[Math.floor(Math.random()*imagenes.length)];
    } while(fotosActivas.includes(imgSrc));

    fotosActivas.push(imgSrc);

    const img = document.createElement("img");
    img.src = imgSrc;
    img.classList.add("foto");

    const lado = Math.random() < 0.5 ? "izq" : "der";

    if(lado === "izq"){
        img.style.left = Math.random()*20 + "vw";
    } else {
        img.style.right = Math.random()*20 + "vw";
    }

    img.style.top = (Math.random()*70 + 20) + "vh";

    document.body.appendChild(img);

    /* EMOJIS AL PASAR */
    img.addEventListener("mousemove", function(e){
        const emojis = ["💛","😍","🥰","💖","✨"];
        const emoji = document.createElement("div");
        emoji.classList.add("emoji");
        emoji.innerText = emojis[Math.floor(Math.random()*emojis.length)];
        emoji.style.left = e.pageX + "px";
        emoji.style.top = e.pageY + "px";
        document.body.appendChild(emoji);
        setTimeout(()=>emoji.remove(),1000);
    });

    setTimeout(()=>{
        img.remove();
        fotosActivas = fotosActivas.filter(f=>f!==imgSrc);
    },6000);
}

setInterval(crearFoto, 1500);

</script>

</body>
</html>
