/* ---------- 404 ---------- */

}

/* ---------- MAIN ---------- */
#main{

background:linear-gradient(135deg,#ffd6e8,#fff3b0);

}

#frase{

max-width:400px;
}

/* ---------- FOTOS FLOAT ---------- */
.floatImg{
position:fixed;
width:140px;
height:180px;
object-fit:cover;
border-radius:15px;
opacity:0;
animation:floatAnim linear forwards;
}

@keyframes floatAnim{
0%{opacity:0; transform:translateY(20px);}
20%{opacity:0.8;}
80%{opacity:0.8;}
100%{opacity:0; transform:translateY(-40px);}
}

.fadeOut{
animation:fadeOut 1s forwards;
}

@keyframes fadeOut{
to{opacity:0; visibility:hidden;}
}

</style>

/* ---------- FOTOS RANDOM ---------- */
const totalFotos=15;

function random(min,max){
return Math.random()*(max-min)+min;
}

function crearFoto(){
let img=document.createElement("img");
let num=Math.floor(Math.random()*totalFotos)+1;
img.src=num+".jpeg";
img.className="floatImg";

let lado=Math.random()<0.5?"left":"right";
img.style[lado]=random(0,10)+"%";
img.style.top=random(10,70)+"%";
img.style.animationDuration=random(6,10)+"s";

document.body.appendChild(img);

setTimeout(()=>img.remove(),10000);
}

function startFloating(){
