<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz San Valentín 💛</title>

<link rel="icon" type="image/png" href="corazon.png">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    background: linear-gradient(135deg, #ffd6e8, #fff3b0);
}

#errorScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
}

.main {
    display: none;
    width: 100%;
    height: 100vh;
    position: relative;
}

.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 360px;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
    z-index: 5;
}

h1 {
    font-family: 'Great Vibes', cursive;
    color: #ff4f87;
    font-size: 36px;
}

video {
    width: 240px;
    border-radius: 15px;
}

#mensaje {
    margin-top: 15px;
    min-height: 70px;
    font-size: 14px;
}

button {
    margin-top: 8px;
    padding: 6px 12px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    background: #ff6b9d;
    color: white;
    transition: 0.2s;
}

button:hover {
    background: #ff4f87;
}

#diarioModal {
    display: none;
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    z-index: 50;
}

#diarioContent {
    background: white;
    width: 400px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
    border-radius: 15px;
}

textarea {
    width: 100%;
    height: 80px;
    border-radius: 10px;
    padding: 8px;
}

.nota {
    background: #fff8dc;
    padding: 10px;
    border-radius: 10px;
    margin-top: 10px;
    font-size: 13px;
}

.foto {
    position: absolute;
    width: 150px;
    height: 200px;
    object-fit: cover;
    border-radius: 15px;
    opacity: 0;
    animation: flotar 9s ease forwards;
    z-index: 1;
}

@keyframes flotar {
    0% { opacity: 0; transform: translateY(0px); }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-80px); }
}

.emoji {
    position: absolute;
    font-size: 20px;
    animation: emojiFloat 1s ease-out forwards;
    pointer-events: none;
    z-index: 100;
}

@keyframes emojiFloat {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-40px); }
}
</style>
</head>

<body>

<div id="errorScreen">
    <h1>404 - Página No Encontrada</h1>
    <p>Introduce la contraseña 💛</p>
    <input type="password" id="password">
    <button onclick="checkPassword()">Entrar</button>
</div>

<div class="main" id="mainContent">
    <div class="container">
        <h1>Feliz San Valentín 💛</h1>

        <video autoplay loop muted playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>

        <p id="mensaje"></p>

        <button onclick="abrirDiario()">Escribir pensamiento 📝</button>
        <button onclick="verNotas()">Ver notas 📒</button>
    </div>
</div>

<div id="diarioModal">
    <div id="diarioContent">
        <h3>Nuestro Diario 💛</h3>
        <textarea id="textoNota"></textarea>
        <button onclick="guardarNota()">Guardar</button>
        <div id="listaNotas"></div>
        <button onclick="cerrarDiario()">Cerrar</button>
    </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA4pvaw4bZ42SEgoW3g9G2FPsHgIwu3JjQ",
  authDomain: "project-2754532206254803154.firebaseapp.com",
  projectId: "project-2754532206254803154",
  storageBucket: "project-2754532206254803154.firebasestorage.app",
  messagingSenderId: "380050788977",
  appId: "1:380050788977:web:c097824d473311576b41d0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Esperar a que cargue el DOM
document.addEventListener("DOMContentLoaded", () => {

  const btnFormulario = document.querySelector("button:nth-of-type(1)");
  const btnVerNotas = document.querySelector("button:nth-of-type(2)");
  const btnGuardar = document.querySelector("#formulario button");

  btnFormulario.addEventListener("click", () => {
    document.getElementById("formulario").style.display = "block";
  });

  btnGuardar.addEventListener("click", async () => {

    const texto = document.getElementById("texto").value;

    if(texto.trim() === "") return;

    await addDoc(collection(db, "notas"), {
      texto: texto,
      fecha: new Date()
    });

    alert("Guardado 💖");
    document.getElementById("texto").value = "";
  });

  btnVerNotas.addEventListener("click", async () => {

    const querySnapshot = await getDocs(collection(db, "notas"));
    const contenedor = document.getElementById("notas");
    contenedor.innerHTML = "";

    querySnapshot.forEach((doc) => {
      const data = doc.data();
      const fecha = new Date(data.fecha.seconds * 1000);

      contenedor.innerHTML += `
        <div class="note">
          <strong>${fecha.toLocaleString()}</strong>
          <p>${data.texto}</p>
        </div>
      `;
    });

  });

});

</script>


</body>
</html>
