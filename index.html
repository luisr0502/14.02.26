<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti 💛</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
overflow-x:hidden;
background:black;
color:white;
}

/* ---------- INTRO ---------- */
#introScreen{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
text-align:center;
}

#introVideo{
position:absolute;
width:100%;
max-height:70%;
opacity:0;
animation:fadeInVideo 2s forwards;
}

@keyframes fadeInVideo{
to{opacity:1;}
}

#passwordBox{
display:none;
position:absolute;
bottom:15%;
}

#introScreen.fadeOut{
animation:fadeOut 1s forwards;
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* ---------- CARTA ---------- */
#coverLetter{
position:fixed;
inset:0;
background:linear-gradient(135deg,#ffd6e8,#fff3b0);
display:none;
justify-content:center;
align-items:center;
z-index:9998;
color:black;
text-align:center;
}

.letter{
background:white;
padding:30px;
border-radius:20px;
cursor:pointer;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

/* ---------- FONDO FOTOS ---------- */
.floating{
position:fixed;
width:120px;
opacity:0.15;
animation:floatUp linear infinite;
}

@keyframes floatUp{
from{transform:translateY(100vh);}
to{transform:translateY(-150px);}
}

/* ---------- CONTENIDO ---------- */
#mainContent{
display:none;
background:linear-gradient(135deg,#ffd6e8,#fff3b0);
min-height:100vh;
color:black;
padding:20px;
}

.layout{
display:flex;
flex-wrap:wrap;
gap:20px;
}

.left,.right{
flex:1;
min-width:300px;
}

.slideshow img{
width:100%;
height:300px;
object-fit:cover;
border-radius:15px;
transition:opacity 0.5s ease;
}

button{
padding:8px 15px;
border:none;
border-radius:20px;
background:#ff6b9d;
color:white;
cursor:pointer;
margin-top:10px;
}

/* ---------- JUEGOS ---------- */
.gameBox{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

#heartGame span{
position:absolute;
font-size:24px;
cursor:pointer;
}

</style>
</head>
<body>

<!-- INTRO -->
<div id="introScreen">
<h1>Error 404</h1>
<p>Página no encontrada...</p>

<video id="introVideo" autoplay muted playsinline>
<source src="intro.mp4" type="video/mp4">
</video>

<div id="passwordBox">
<p>Ups… necesitas la contraseña 💛</p>
<input type="password" id="pass">
<button onclick="checkPassword()">Entrar</button>
<p id="errorMsg"></p>
</div>
</div>

<!-- CARTA -->
<div id="coverLetter">
<div class="letter" onclick="startSite()">
<h2>Antes de entrar…</h2>
<p>Toca aquí 💛</p>
</div>
</div>

<!-- CONTENIDO -->
<div id="mainContent">
<h1 style="text-align:center;">Para Ti 💛</h1>

<div class="layout">

<div class="left">

<div class="slideshow">
<img id="slide" src="1.jpeg">
</div>

<video width="100%" controls>
<source src="tuvideo.mp4" type="video/mp4">
</video>

<button onclick="changePhrase()">Tócame 💛</button>
<p id="phrase"></p>

</div>

<div class="right">

<div class="gameBox">
<h3>Atrapa el corazón 💛</h3>
<div id="heartGame" style="position:relative;height:150px;"></div>
</div>

<div class="gameBox">
<h3>Pingüino salta 🐧</h3>
<button onclick="jump()">Saltar</button>
<p id="jumpCount">Saltos: 0</p>
</div>

<div class="gameBox">
<h3>Memoria 🎯</h3>
<button onclick="memoryGame()">Revelar sorpresa</button>
<p id="memoryResult"></p>
</div>

<div class="gameBox">
<h3>Mini Trivia 💬</h3>
<p>¿Cuál fue nuestro primer plan juntos?</p>
<p>¿Qué canción nos representa?</p>
<p>¿Cuál fue el momento más inesperado?</p>
</div>

</div>
</div>
</div>

<audio id="music" loop>
<source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

/* INTRO */
document.getElementById("introVideo").onended=function(){
document.getElementById("passwordBox").style.display="block";
};

function checkPassword(){
if(document.getElementById("pass").value==="221124"){
document.getElementById("introScreen").classList.add("fadeOut");
document.getElementById("coverLetter").style.display="flex";
}else{
document.getElementById("errorMsg").innerText="Contraseña incorrecta 💔";
}
}

/* CARTA */
function startSite(){
document.getElementById("coverLetter").style.display="none";
document.getElementById("mainContent").style.display="block";
document.getElementById("music").play();
generateFloating();
}

/* SLIDESHOW */
const images=["1.jpeg","2.jpeg","3.jpeg","4.jpeg","5.jpeg","6.jpeg","7.jpeg","8.jpeg","9.jpeg","10.jpeg","11.jpeg","12.jpeg","13.jpeg","14.jpeg","15.jpeg"];
let i=0;
setInterval(()=>{
i=(i+1)%images.length;
document.getElementById("slide").src=images[i];
},3000);

/* FRASES */
const phrases=[
"Eres mi lugar favorito 💛",
"Contigo todo es más bonito ✨",
"Quiero abrazarte siempre 🤗",
"Gracias por existir 💫"
];
let p=0;
function changePhrase(){
document.getElementById("phrase").innerText=phrases[p];
p=(p+1)%phrases.length;
}

/* CORAZONES */
setInterval(()=>{
let heart=document.createElement("span");
heart.innerText="💛";
heart.style.left=Math.random()*250+"px";
heart.style.top=Math.random()*120+"px";
heart.onclick=()=>heart.remove();
document.getElementById("heartGame").appendChild(heart);
setTimeout(()=>heart.remove(),2000);
},1000);

/* SALTO */
let jumps=0;
function jump(){
jumps++;
document.getElementById("jumpCount").innerText="Saltos: "+jumps;
}

/* MEMORIA */
function memoryGame(){
document.getElementById("memoryResult").innerText="Nuestra mejor memoria es cada momento juntos 💛";
}

/* FOTOS FLOTANDO */
function generateFloating(){
for(let n=1;n<=15;n++){
let img=document.createElement("img");
img.src=n+".jpeg";
img.className="floating";
img.style.left=Math.random()*100+"%";
img.style.animationDuration=(10+Math.random()*10)+"s";
document.body.appendChild(img);
}
}

</script>
</body>
</html>
