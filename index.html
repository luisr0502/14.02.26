<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti 💛</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e8, #fff3b0);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    max-width: 420px;
    width: 90%;
}

h1 {
    color: #ff6b9d;
}

.slideshow {
    position: relative;
    margin: 20px 0;
}

.slideshow img {
    width: 100%;
    border-radius: 15px;
    transition: opacity 0.5s ease-in-out;
}

.emoji {
    position: absolute;
    font-size: 24px;
    animation: float 1s ease-out forwards;
}

@keyframes float {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-40px); }
}

.video-space {
    margin-top: 15px;
}

button {
    margin-top: 20px;
    padding: 12px 20px;
    border: none;
    background: #ff6b9d;
    color: white;
    font-size: 16px;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff4f87;
}

#mensaje {
    margin-top: 15px;
    color: #444;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
    <h1>Para Ti 💛</h1>

    <!-- SLIDESHOW -->
    <div class="slideshow" id="slideshow">
        <img id="slide" src="foto1.jpg" alt="Recuerdos">
    </div>

    <!-- VIDEO -->
    <div class="video-space">
        <video width="100%" controls>
            <source src="tuvideo.mp4" type="video/mp4">
        </video>
    </div>

    <button onclick="cambiarFrase(); reproducirMusica()">Tócame 💛</button>

    <p id="mensaje"></p>
</div>

<!-- AUDIO -->
<audio id="musica" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

// --- SLIDESHOW ---
const imagenes = ["foto1.jpg", "foto2.jpg", "foto3.jpg"];
let index = 0;

setInterval(() => {
    index = (index + 1) % imagenes.length;
    document.getElementById("slide").src = imagenes[index];
}, 3000);

// --- EMOJIS AL PASAR EL MOUSE ---
const emojis = ["💛","😍","🥰","💖","✨"];
let emojiIndex = 0;

document.getElementById("slideshow").addEventListener("mousemove", function(e){
    const emoji = document.createElement("div");
    emoji.classList.add("emoji");
    emoji.innerText = emojis[emojiIndex];

    emoji.style.left = e.offsetX + "px";
    emoji.style.top = e.offsetY + "px";

    this.appendChild(emoji);

    setTimeout(() => emoji.remove(), 1000);

    emojiIndex = (emojiIndex + 1) % emojis.length;
});

// --- FRASES CAMBIANTES ---
const frases = [
"Gracias por existir 💛",
"Eres mi lugar favorito 🏡",
"Quiero abrazarte siempre 🤗",
"Contigo todo es más bonito ✨",
"Eres mi casualidad favorita 💫"
];

let fraseIndex = 0;

function cambiarFrase() {
    document.getElementById("mensaje").innerText = frases[fraseIndex];
    fraseIndex = (fraseIndex + 1) % frases.length;
}

// --- MUSICA ---
function reproducirMusica(){
    const musica = document.getElementById("musica");
    musica.play();
}

</script>

</body>
</html>
