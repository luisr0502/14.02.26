<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz San Valentín 💛</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    background: linear-gradient(135deg, #ffd6e8, #fff3b0);
}

.main { display:none; height:100vh; position:relative; }

.container {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:360px;
    padding:25px;
    background:white;
    border-radius:20px;
    text-align:center;
}

button {
    margin-top:8px;
    padding:6px 12px;
    border-radius:20px;
    border:none;
    cursor:pointer;
    background:#ff6b9d;
    color:white;
}

#diarioModal {
    display:none;
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
}

#diarioContent {
    background:white;
    width:400px;
    max-height:80vh;
    overflow-y:auto;
    padding:20px;
    border-radius:15px;
}

textarea {
    width:100%;
    height:80px;
    border-radius:10px;
    padding:8px;
}

.nota {
    background:#fff8dc;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="main" id="mainContent" style="display:block;">
    <div class="container">
        <h1>Feliz San Valentín 💛</h1>
        <button id="btnEscribir">Escribir pensamiento 📝</button>
        <button id="btnVer">Ver notas 📒</button>
    </div>
</div>

<div id="diarioModal">
    <div id="diarioContent">
        <h3>Nuestro Diario 💛</h3>
        <textarea id="textoNota"></textarea>
        <button id="btnGuardar">Guardar</button>
        <div id="listaNotas"></div>
        <button id="btnCerrar">Cerrar</button>
    </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA4pvaw4bZ42SEgoW3g9G2FPsHgIwu3JjQ",
  authDomain: "project-2754532206254803154.firebaseapp.com",
  projectId: "project-2754532206254803154",
  storageBucket: "project-2754532206254803154.firebasestorage.app",
  messagingSenderId: "380050788977",
  appId: "1:380050788977:web:c097824d473311576b41d0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const modal = document.getElementById("diarioModal");
const texto = document.getElementById("textoNota");
const btnGuardar = document.getElementById("btnGuardar");
const lista = document.getElementById("listaNotas");

/* MODO ESCRIBIR */
document.getElementById("btnEscribir").addEventListener("click", () => {
    modal.style.display = "flex";
    texto.style.display = "block";
    btnGuardar.style.display = "inline-block";
    lista.innerHTML = "";
});

/* MODO VER */
document.getElementById("btnVer").addEventListener("click", async () => {
    modal.style.display = "flex";
    texto.style.display = "none";
    btnGuardar.style.display = "none";
    lista.innerHTML = "";

    const q = query(collection(db, "notas"), orderBy("fecha", "desc"));
    const snapshot = await getDocs(q);

    snapshot.forEach(doc => {
        const data = doc.data();
        const fecha = new Date(data.fecha.seconds * 1000);

        const div = document.createElement("div");
        div.classList.add("nota");
        div.innerHTML = `
            <strong>${fecha.toLocaleString()}</strong><br>
            ${data.texto}
        `;
        lista.appendChild(div);
    });
});

/* GUARDAR */
btnGuardar.addEventListener("click", async () => {
    if(texto.value.trim() === "") return;

    await addDoc(collection(db, "notas"), {
        texto: texto.value,
        fecha: new Date()
    });

    texto.value = "";
});

/* CERRAR */
document.getElementById("btnCerrar").addEventListener("click", () => {
    modal.style.display = "none";
});

</script>

</body>
</html>
